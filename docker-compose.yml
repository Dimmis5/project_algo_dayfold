services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j-pinterest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: postgres-dayfold
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=dayfold
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dayfold"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: python-app
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - POSTGRES_URI=postgresql://postgres:password123@postgres:5432/dayfold
      - PYTHONUNBUFFERED=1
  frontend:
    build: ./frontend
    container_name: react-dayfold
    ports:
      - "3000:3000"
    depends_on:
      - app
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  neo4j_data:
  postgres_data: